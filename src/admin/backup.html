<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FPL · копии базы</title>
<style>
:root{--ink:#1E1B18;--paper:#F5F1EB;--line:#DDD5CB;--accent:#F2601F;--ok:#2F7D32;--bad:#B3261E}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:26px;margin:0 0 8px}
p.lead{margin:0 0 24px;color:#5E5650}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
small{display:block;color:#7A716A;margin-top:4px;font-size:13px}
button{margin-top:24px;width:100%;padding:14px;border:0;border-radius:999px;background:var(--accent);color:#fff;font:600 16px inherit;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
#out{margin-top:20px;padding:14px 16px;border-radius:10px;display:none}
#out.ok{display:block;background:#E8F3E8;color:var(--ok)}
#out.bad{display:block;background:#FBE9E7;color:var(--bad)}
</style>
</head>
<body>
<main>
  <h1>Копии базы в другом городе</h1>
  <p class="lead">Доступ к закрытому бакету Selectel, куда сервер каждую ночь отправляет копию базы. Ключи сохраняются только на сервере; после сохранения сервер сразу делает пробную запись в бакет.</p>
  <form id="f" autocomplete="off">
    <label for="ik">Ключ приёмника данных</label>
    <input id="ik" type="password" required autocomplete="off">
    <small>Тот же, что в SaleBot (константа site_ingest_key), — из менеджера паролей.</small>

    <label for="bucket">Имя бакета</label>
    <input id="bucket" required placeholder="fpl-backup-msk" pattern="[a-z0-9][a-z0-9.\-]{1,61}[a-z0-9]">

    <label for="pool">Пул бакета</label>
    <select id="pool">
      <option value="ru-7" selected>ru-7 — Москва</option>
      <option value="ru-6">ru-6 — Москва</option>
      <option value="gis-1">gis-1 — Москва</option>
      <option value="ru-1">ru-1 — Санкт-Петербург (тот же город, что сервер)</option>
      <option value="ru-3">ru-3 — Санкт-Петербург (тот же город, что сервер)</option>
    </select>

    <label for="ak">Access key</label>
    <input id="ak" required autocomplete="off">

    <label for="sk">Secret key</label>
    <input id="sk" type="password" required autocomplete="off">

    <button id="b" type="submit">Сохранить и проверить</button>
  </form>
  <div id="out" role="status"></div>
</main>
<script>
(function(){
  var f=document.getElementById('f'), out=document.getElementById('out'), b=document.getElementById('b');
  var ERR={bad_key:'Неверный ключ приёмника.',bad_bucket:'Имя бакета: только латиница в нижнем регистре, цифры, точки и дефисы.',
    bad_pool:'Неизвестный пул.',bad_access_key:'Access key выглядит неправильно — скопируйте его целиком, без пробелов.',
    bad_secret_key:'Secret key выглядит неправильно — скопируйте его целиком, без пробелов.',
    upload_failed:'Пробная запись в бакет не удалась.',no_s3_module:'На сервере нет модуля записи — сообщите Claude.'};
  function show(ok,text){out.className=ok?'ok':'bad';out.textContent=text;}
  f.addEventListener('submit',function(e){
    e.preventDefault(); b.disabled=true; show(true,'Проверяю…');
    fetch('/api/settings/backup',{method:'POST',headers:{'Content-Type':'application/json','X-FPL-Key':document.getElementById('ik').value},
      body:JSON.stringify({bucket:document.getElementById('bucket').value.trim(),pool:document.getElementById('pool').value,
        access_key:document.getElementById('ak').value.trim(),secret_key:document.getElementById('sk').value.trim()})})
    .then(function(r){return r.json().catch(function(){return {ok:false,error:'http_'+r.status};});})
    .then(function(j){
      if(j.ok){
        document.getElementById('sk').value=''; document.getElementById('ik').value='';
        show(true,'Готово: пробный файл записан в бакет «'+j.bucket+'» ('+j.pool+'). Первая копия базы уйдёт в течение часа, дальше — каждую ночь.'+(j.warning==='same_city'?' Внимание: бакет в том же городе, что и сервер.':''));
      } else {
        var t=ERR[j.error]||('Ошибка: '+j.error);
        if(j.error==='upload_failed') t+=' Код '+j.http+(j.detail?' ('+j.detail+')':'')+'. Проверьте имя бакета, пул и что у ключа есть доступ к этому бакету.';
        show(false,t);
      }
    }).catch(function(){show(false,'Сервер не ответил. Попробуйте ещё раз через минуту.');})
    .then(function(){b.disabled=false;});
  });
})();
</script>
</body>
</html>
