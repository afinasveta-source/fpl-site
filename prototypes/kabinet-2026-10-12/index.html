<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кабинет FPL · исправленный прототип</title><link rel="stylesheet" href="fonts.css">

</head><body>

<div class="proto min" role="region" aria-label="Управление прототипом">
 <div class="proto-summary">
  <b>Прототип · уточнение статусов · без подключения данных</b>
  <a class="proto-back" href="overview/">← Все кабинеты</a>
  <button class="proto-toggle" id="protoMin" type="button" aria-expanded="false" aria-controls="protoControls">Настройки прототипа</button>
 </div>
 <div class="proto-controls" id="protoControls" hidden>
  <div class="proto-basic">
  <label class="opt" for="scn">Сценарий
    <select id="scn">
      <option value="new">Новый участник, Игр нет</option>
      <option value="prep">Перед туром · тема или референс</option>
<option value="active" selected>Идёт тур, работу нужно сдать</option>
      <option value="sent_closed">Работа сдана · срок замены закончился</option>
<option value="sent">Работа сдана, ждём итог</option>
<option value="waiting">Записался, ждёт начала Игры</option>
<option value="expired">Срок прошёл, работа не сдана</option>
      <option value="out">Выбыл по оценке, дальнейший путь</option>
<option value="done_prize">Призёр · 2 место в лиге</option>
<option value="done_no_place">Диплом выдан, место не указано</option>
<option value="done">Игра завершена, итоги опубликованы</option>
    </select>
  </label>
  <label class="opt" for="net">Сеть
    <select id="net"><option value="ok">работает</option><option value="slow">медленная</option><option value="off">нет связи</option></select>
  </label>
  <button class="proto-login" id="toLogin" type="button">Экран входа</button>
  </div>
  <div class="proto-fields" id="protoFields"></div>
  <p class="proto-hint">Все даты, суммы, оценки и правила событий — примеры; действия только в прототипе</p>
 </div>
</div>

<div id="app"></div>

<script>
(function(){
"use strict";
var TZ = "МСК (UTC+3)";
var S = { scn:"active", net:"ok", route:"home", params:{}, hist:[], authed:true, welcomed:true,
  draft:[], drafts:{}, sentAt:null, applied:{}, tickets:null, readN:{}, site:false, mkt:false, name:"Анна Петрова", pname:"Анна П.", menu:false };
try{ var sv=JSON.parse(localStorage.getItem("fplProtoV4")||"{}"); if(sv.scn) S.scn=sv.scn; }catch(e){}

/* ---------- данные-примеры ---------- */
function fmt(d){ return d; }
var GAME = { id:"g1", title:"Игра 01", season:"Сезон 1", type:"Рейтинговая Игра", period:"30 сентября — 26 октября 2026", rules:"Правила лиги, редакция 1.9" };
var NEXT = { id:"g2", title:"Игра 02", type:"Рейтинговая Игра", period:"9 — 30 ноября 2026", reg:"Регистрация до 7 ноября, 23:59 МСК", price:"1 500 ₽", priceNote:"Льгота первой Игры в этом примере условная; реальные условия задаёт организатор", status:"open" };
var CH = { id:"c1", title:"Челлендж «Осенний лист»", type:"Открытый челлендж", period:"28 октября — 3 ноября 2026", reg:"Регистрация откроется 25 октября", price:"Бесплатно", status:"soon" };
var FIN = { id:"f1", title:"Суперфинал Сезона 1", type:"Финал сезона", period:"Февраль 2027", reg:"Условия допуска задаются правилами сезона", price:"—", status:"closed" };

function tours(){
  var base = [
    {n:1, name:"Бабочка", kind:"Общее задание", open:"30 сентября", due:"4 октября, 02:00", judge:"5 октября, 14:00"},
    {n:2, name:"Обмен темами", kind:"Тема от другого участника", open:"6 октября", due:"9 октября, 23:59", judge:"11 октября, 14:00"},
    {n:3, name:"Портрет-персонаж", kind:"Задание по лигам", open:"12 октября", due:"15 октября, 23:59", judge:"17 октября, 14:00"},
    {n:4, name:"Сюжет на лице", kind:"Задание по лигам", open:"18 октября", due:"21 октября, 23:59", judge:"22 октября, 14:00"},
    {n:5, name:"Финал Игры", kind:"Пара: новичок + опытный", open:"23 октября", due:"25 октября, 23:59", judge:"26 октября, 20:00"}];
  var st = {
    active:["pub","pub","open","plan","plan"],
    sent:["pub","pub","judging","plan","plan"],
    out:["pub","pub","open","plan","plan"],
    done:["pub","pub","pub","pub","pub"]}[S.scn] || [];
  var res = {
    active:[{score:"78,4", next:"Проход дальше", top:false},{score:"84,1", next:"Проход дальше", top:true}],
    sent:[{score:"78,4", next:"Проход дальше", top:false},{score:"84,1", next:"Проход дальше", top:true}],
    out:[{score:"71,2", next:"Проход дальше", top:false},{score:"52,6", next:"Конкурсный путь завершён", top:false}],
    done:[{score:"78,4",next:"Проход дальше"},{score:"84,1",next:"Проход дальше",top:true},{score:"81,0",next:"Проход дальше"},{score:"88,7",next:"Проход дальше",top:true},{score:"86,3",next:"Итог Игры"}]}[S.scn]||[];
  return base.map(function(t,i){ t.state=st[i]||"plan"; t.res=res[i]||null; return t; });
}
function curTour(){ var t=tours(); for(var i=0;i<t.length;i++) if(t[i].state==="open"||t[i].state==="judging") return t[i]; return null; }
/* Шаги туров для главной: ✓ — итог опубликован, точка — текущий тур */
function tourSteps(tt){ var lbl={pub:"итог опубликован",open:"идёт сдача",judging:"оценивание",plan:"впереди",miss:"работа не сдана",lsub:"сдана после срока",osub:"сдана вне конкурса",left:"не участвует"};
  var done=tt.filter(function(x){return x.state==="pub"}).length;
  return '<ol class="tsteps" aria-label="Туры Игры: итогов опубликовано '+done+' из '+tt.length+'">'+tt.map(function(t){ var c=t.state==="pub"?"done":(t.state==="open"||t.state==="judging")?"now":t.state==="miss"?"miss":t.state==="lsub"?"lsub":t.state==="osub"?"done":""; return '<li class="'+c+'"'+(c==="now"?' aria-current="step"':'')+'><i aria-hidden="true"></i><span><span class="vh">Тур </span>'+t.n+'<span class="vh">: '+lbl[t.state]+'</span></span></li>'; }).join("")+'</ol>'; }
/* Стадия калибровки после тура n: ◆ — пройденный рейтинговый тур (демо: туры 1–3) */
function calib(n){ var k=Math.min(n,3); return k>=3?'<span class="calib" aria-label="Калибровка завершена">◆◆◆</span> завершена':'<span class="calib" aria-hidden="true">'+"◆◆◆".slice(0,k)+"◇◇◇".slice(0,3-k)+'</span> '+k+' из 3'; }
/* ===== Состояние участия в Игре: в конкурсе / вне конкурса / вышел (11.10.2026) =====
   late — опоздал со сдачей и участвует вне конкурса; out — не прошёл отбор жюри
   (S.outChosen: выбрал вне конкурса); expired — не сдал, выбор ещё не открыт;
   withdrawn — вышел из Игры; unfinished — Игра закончилась, работы не сданы. Всё демо. */
var OUT_DUE="25 октября, 23:59";
function compState(){ var s=S._st||S.scn;
  if(s==="late") return "outside_late"; if(s==="out") return S.outChosen?"outside_judged":"out_pending";
  if(s==="expired") return "missed_pending"; if(s==="withdrawn") return "withdrawn"; if(s==="unfinished") return "unfinished";
  if(s.indexOf("done")===0) return "done"; return "in"; }
function isOutside(){ var c=compState(); return c==="outside_late"||c==="outside_judged"; }
function compPill(c){ var m={in:["В конкурсе","ok"],outside_late:["Вне конкурса","warn"],outside_judged:["Вне конкурса","warn"],out_pending:["Не прошли в отбор","warn"],missed_pending:["Работа не сдана","bad"],withdrawn:["Вы вышли из Игры","plain"],unfinished:["Игра не завершена","plain"],done:["Завершена","ok"]}[c]||["В конкурсе","ok"]; return pill(m[0],m[1]); }
function outsideNote(c){ return c==="outside_late"?'Вне конкурса сроков туров нет: сдавайте задания, когда удобно, но все — до конца Игры. Тогда выдаётся диплом. Зачёта Игры не будет: работа тура 2 не сдана в срок. Работы вне конкурса не судят.':'Вне конкурса сроков туров нет: сдавайте задания, когда удобно, но все — до конца Игры. Тогда выдаётся диплом. Если каждую работу сдать в срок её тура — Игра ещё и засчитается. Работы вне конкурса не судят.'; }
function hasGame(){ return S.scn!=="new"; }

var NOTIFS = function(){
  var n = [];
  if(S.scn==="active") n.push({id:1, t:"Открыт тур 3 «Портрет-персонаж»", s:"Сдать работу до 15 октября, 23:59 МСК", d:"12 октября, 10:00", go:"task", unread:true});
  if(S.scn==="sent") n.push({id:2, t:"Работа к туру 3 принята", s:"Версия от 14 октября, 21:12 МСК передана на оценку", d:"14 октября, 21:12", go:"sent", unread:true});
  if(S.scn==="out") n.push({id:3, t:"Опубликован результат тура 2", s:"В отбор не прошли — диплом и зачёт за вами. Можно продолжить Игру вне конкурса", d:"11 октября, 14:05", go:"outcome", p:{n:2}, unread:true});
  if(S.scn==="late") n.push({id:3, t:"Срок сдачи тура 2 прошёл", s:"Работа не сдана. Продолжить можно вне конкурса: все работы — до конца Игры, тогда будет диплом", d:"10 октября, 10:00", unread:true, go:"game"});
  if(S.scn==="done") n.push({id:4, t:"Итоги Игры 01 опубликованы", s:"Ваш диплом FPL-S1-01-S-0007 выдан", d:"26 октября, 20:30", go:"final", unread:true});
  n.push({id:5, t:"Открыта регистрация на Игру 02", s:"До 7 ноября, 23:59 МСК", d:"5 октября, 12:00", go:"event", p:{id:"g2"}, unread:S.scn==="new"});
  n.push({id:6, t:"Ответ организатора по обращению №214", s:"«Можно ли заменить фото после сдачи?»", d:"3 октября, 18:40", go:"ticket", p:{id:214}, unread:false});
  return n.map(function(x){ if(S.readN[x.id]) x.unread=false; return x; });
};
function unread(){ return NOTIFS().filter(function(x){return x.unread}).length; }

function tickets(){
  if(!S.tickets) S.tickets=[
    {id:214, t:"Можно ли заменить фото после сдачи?", ctx:"Игра 01 · Тур 1", st:"closed", d:"3 октября", msgs:[
      {me:true, who:"Вы", at:"3 октября, 16:02", x:"Сдала работу, а потом заметила, что фото тёмное. Можно заменить?"},
      {me:false, who:"Организатор", at:"3 октября, 18:40", x:"Да, фото и ссылку можно заменить до конца срока сдачи. После сохранения замены действует новая сданная версия. Когда срок закончится, замена закрывается."}]},
    {id:221, t:"Не пришло уведомление о туре 2", ctx:"Игра 01 · Тур 2", st:"wait_org", d:"7 октября", msgs:[
      {me:true, who:"Вы", at:"7 октября, 09:15", x:"Тур 2 открылся, но в Telegram ничего не пришло."}]}];
  return S.tickets;
}

/* ---------- утилиты ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}); }
function pill(t,k){ return '<span class="pill '+(k||"")+'">'+esc(t)+'</span>'; }
function dl(date,rel){ return '<div class="deadline"><span class="d num">'+esc(date)+'</span><span class="tz">'+TZ+(rel?' · '+esc(rel):'')+'</span></div>'; }
function back(to,label,p){ return '<button class="back" type="button" data-go="'+to+'"'+(p?' data-p=\''+JSON.stringify(p)+'\'':'')+'>‹ '+esc(label)+'</button>'; }
function crumb(items){ return '<nav class="crumb" aria-label="Путь">'+items.map(function(it,i){ return (i?'<span aria-hidden="true">/</span>':'')+(it[1]?'<button type="button" data-go="'+it[1]+'"'+(it[2]?' data-p=\''+JSON.stringify(it[2])+'\'':'')+'>'+esc(it[0])+'</button>':'<span>'+esc(it[0])+'</span>'); }).join("")+'</nav>'; }
function li(t,s,right,go,p,cls){ return '<button class="li '+(cls||"")+'" type="button"'+(go?' data-go="'+go+'"':'')+(p?' data-p=\''+JSON.stringify(p)+'\'':'')+'><span class="t">'+t+'</span>'+(s?'<span class="s">'+s+'</span>':'')+'<span class="r">'+(right||"")+'</span></button>'; }
function toast(t){ document.querySelectorAll(".toast").forEach(function(x){x.remove()}); var el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); el.textContent=t; document.body.appendChild(el); setTimeout(function(){el.remove()},2600); }
function tourState(t){ return {pub:pill("Итог опубликован","ok"), open:pill("Идёт сдача","acc"), judging:pill("Судейство","info"), plan:pill("Запланирован","plain")}[t.state]; }
function netGuard(){ if(S.net==="off"){ toast("Нет связи. Действие не выполнено — повторите, когда сеть вернётся."); return false;} return true; }
function withLoad(fn){ if(!netGuard()) return; if(S.net==="slow"){ var b=document.activeElement; if(b&&b.tagName==="BUTTON"){ b.disabled=true; b.textContent="Отправляем…"; } setTimeout(fn,1400);} else fn(); }

function actbar(inner){ return '<div class="actbar">'+inner+'</div>'; }
function crumbsFor(r,p){ p=p||{}; var G=[["Мои Игры","my"],["Игра 01","game"]], T=G.concat([["Тур 3","task",{n:3}]]);
  var ev={g2:"Игра 02",c1:"Челлендж «Осенний лист»",f1:"Суперфинал"}[p.id]||"Игра 02";
  var m={event:[["Игры лиги","catalog"],[ev]], doc:[["Игры лиги","catalog"],["Игра 02","event",{id:"g2"}],[p.d==="rules"?"Правила Игры":"Согласие на публикацию"]],
   applied:[["Игры лиги","catalog"],["Игра 02","event",{id:"g2"}],["Заявка отправлена"]], admission:[["Мои Игры","my"],["Игра 02 · заявка"]], payment:[["Мои Игры","my"],["Игра 02","admission"],["Оплата"]],
   game:[["Мои Игры","my"],["Игра 01"]], task:G.concat([["Тур "+(p.n||3)]]), draft:T.concat([["Фото работы"]]), review:T.concat([["Проверка"]]),
   sent:G.concat([["Тур 3 · принятая работа"]]), outcome:G.concat([["Тур "+(p.n||1)+" · итог"]]), final:G.concat([["Итог Игры"]]),
   rating:[["Мои достижения","ach"],["Рейтинг FPL"]], points:[["Мои достижения","ach"],["Баллы лиги"]], path:[["Мои достижения","ach"],["Путь к финалу"]], history:[["Мои достижения","ach"],["История результатов"]], diplomas:[["Мои достижения","ach"],["Дипломы"]],
   ticket:[["Поддержка","support"],["Обращение №"+(p.id||"")]], newticket:[["Поддержка","support"],["Новое обращение"]],
   name:[["Профиль","profile"],["Имя"]], security:[["Профиль","profile"],["Вход и пароль"]], notifset:[["Профиль","profile"],["Уведомления"]], consents:[["Профиль","profile"],["Согласия и документы"]], publicity:[["Профиль","profile"],["Публичность"]], place:[["Профиль","profile"],["Страна и город"]], rulesupd:[["Главная","home"],["Правила Игры"]]};
  var it=m[r]; if(!it) return "";
  var up=it[it.length-2];
  return '<nav class="crumb" aria-label="Путь"><button type="button" class="up" data-go="'+up[1]+'"'+(up[2]?' data-p=\''+JSON.stringify(up[2])+'\'':'')+' aria-label="Назад: '+esc(up[0])+'">‹</button>'+it.map(function(x,i){ return (i?'<span aria-hidden="true">/</span>':'')+(x[1]&&i<it.length-1?'<button type="button" data-go="'+x[1]+'"'+(x[2]?' data-p=\''+JSON.stringify(x[2])+'\'':'')+'>'+esc(x[0])+'</button>':'<span>'+esc(x[0])+'</span>'); }).join("")+'</nav>'; }
/* ---------- экраны ---------- */
var V = {};

/* До входа */
V.login = function(){ return '<div class="auth stack" style="gap:18px; padding-top:12px">'+
  '<div class="stack"><span class="eyebrow">Face Painting League</span><h1>Вход в кабинет</h1><p class="muted">Участвовали в Играх через бота? Ваш аккаунт уже создан — войдите по приглашению из письма или по email и паролю.</p></div>'+
  '<form class="card" id="fLogin" novalidate>'+
  '<div class="field"><label for="em">Email</label><input class="input" id="em" type="email" autocomplete="email" value="anna@example.com"></div>'+
  '<div class="field"><label for="pw">Пароль</label><div class="pw"><input class="input" id="pw" type="password" autocomplete="current-password" value="example-pass"><button type="button" data-act="showpw">Показать</button></div><span class="err" id="loginErr" hidden></span></div>'+
  '<button class="btn wide" type="submit">Войти</button>'+
  '<div class="between small"><button class="btn ghost" type="button" data-go="reset">Не помню пароль</button><button class="btn ghost" type="button" data-go="activate">У меня приглашение</button></div>'+
  '</form><p class="small muted">Попробуйте неверный пароль — например, «123», чтобы увидеть ошибку.</p></div>'; };

V.activate = function(){ return '<div class="auth stack" style="gap:18px; padding-top:12px">'+back("login","Ко входу")+
  '<div class="stack"><span class="eyebrow">Приглашение</span><h1>Активация аккаунта</h1><p class="muted">Это ваш аккаунт из бота лиги: история Игр и результаты уже в нём. Осталось задать пароль.</p></div>'+
  '<div class="card"><dl class="kv"><dt>Участник</dt><dd>Анна П.</dd><dt>Email</dt><dd>an•••@example.com</dd><dt>Ссылка</dt><dd>'+pill("Действует до 10 октября","ok")+'</dd></dl>'+
  '<div class="field"><label for="np1">Новый пароль</label><input class="input" id="np1" type="password" autocomplete="new-password" minlength="12" maxlength="128"><span class="hint">От 12 до 128 символов</span></div>'+
  '<div class="field"><label for="np2">Повторите пароль</label><input class="input" id="np2" type="password" autocomplete="new-password" minlength="12" maxlength="128"><span class="err" id="actErr" hidden></span></div>'+
  '<button class="btn wide" type="button" data-act="activate">Сохранить пароль и войти</button></div>'+
  '<div class="note small">Если ссылка устарела, напишите организатору в бот — пришлём новую. Второй аккаунт создавать не нужно.</div></div>'; };

V.reset = function(p){ var done=p&&p.done; return '<div class="auth stack" style="gap:18px; padding-top:12px">'+back("login","Ко входу")+
  '<div class="stack"><h1>Восстановление доступа</h1><p class="muted">Укажите email, который привязан к кабинету.</p></div>'+
  (done ? '<div class="card"><div class="note info">Если такой email есть в лиге, на него придёт ссылка для нового пароля. Ссылка действует 30 минут и работает один раз.</div><button class="btn sec" type="button" data-go="newpass">Открыть ссылку из письма (пример)</button></div>'
  : '<div class="card"><div class="field"><label for="rem">Email</label><input class="input" id="rem" type="email" autocomplete="email"></div><button class="btn wide" type="button" data-act="reset">Получить ссылку</button></div>')+'</div>'; };

V.newpass = function(){ return '<div class="auth stack" style="gap:18px; padding-top:12px">'+
  '<div class="stack"><h1>Новый пароль</h1><p class="muted">После сохранения все прежние входы на других устройствах завершатся.</p></div>'+
  '<div class="card"><div class="field"><label for="rp1">Новый пароль</label><input class="input" id="rp1" type="password" autocomplete="new-password" minlength="12" maxlength="128"><span class="hint">От 12 до 128 символов</span></div>'+
  '<div class="field"><label for="rp2">Повторите пароль</label><input class="input" id="rp2" type="password" autocomplete="new-password" minlength="12" maxlength="128"><span class="err" id="npErr" hidden></span></div>'+
  '<button class="btn wide" type="button" data-act="newpass">Сохранить пароль</button></div></div>'; };

/* Главная */
V.home = function(){
  var t=curTour(), h='';

  if(el.hasAttribute("data-act")){ var a=el.getAttribute("data-act"); if(A[a]){ if(a!=="closeMenu") e.preventDefault(); A[a](el,e); } return; }
  var p=null; try{ p=JSON.parse(el.getAttribute("data-p")||"null"); }catch(x){}
  go(el.getAttribute("data-go"),p);
});
document.addEventListener("submit",function(e){ e.preventDefault(); var f=e.target;
  if(f.id==="fLogin"){ var pw=document.getElementById("pw").value, er=document.getElementById("loginErr");
    if(pw.length<6){ er.hidden=false; er.textContent="Неверный email или пароль. Проверьте раскладку или восстановите доступ."; document.getElementById("pw").classList.add("bad"); return; }
    withLoad(function(){ S.authed=true; go("home"); }); }
  if(f.id==="fTicket"){ var tx=document.getElementById("tx").value.trim(), tt=document.getElementById("tt").value.trim(), te=document.getElementById("tErr");
    if(!tx){ te.hidden=false; te.textContent="Опишите вопрос — без текста обращение не отправить."; return; }
    withLoad(function(){ var id=230+tickets().length; var ctx=(S.params&&S.params.ctx)||(document.getElementById("tctx")?document.getElementById("tctx").value:"Общий вопрос");
      tickets().unshift({id:id,t:tt||tx.slice(0,60),ctx:ctx,st:"wait_org",d:nowStr().split(",")[0],msgs:[{me:true,who:"Вы",at:nowStr(),x:tx}]}); toast("Обращение №"+id+" создано"); go("ticket",{id:id}); }); }
  if(f.id==="fName"){ var v=document.getElementById("pn").value.trim(), er2=document.getElementById("pnErr");
    if(v&&v.length<2){ er2.hidden=false; er2.textContent="Слишком коротко: нужно от 2 символов."; return; }
    withLoad(function(){ S.pname=v; toast("Сохранено. Имя изменено только в прототипе; публикация на сайте не выполняется."); go("profile"); }); }
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="scn"){ S.scn=t.value; S.draft=[]; S.outSent=0; S.applied={}; S.readN={}; S.hist=[]; S.route="home"; S.params={}; try{localStorage.setItem("fplProtoV4",JSON.stringify({scn:S.scn}))}catch(x){} render(); }
  if(t.id==="net"){ S.net=t.value; S._slowOnce=null; render(); }
  if(t.id==="file" && t.files && t.files[0]){ var f=t.files[0]; if(!["image/jpeg","image/png","image/webp"].includes(f.type)){ toast("Выберите фото JPG, PNG или WebP."); return; } if(f.size>10*1024*1024){ toast("Файл больше 10 МБ. Выберите другой."); return; } if(!netGuard()) return;
    var had=S.draft.length; var rd=new FileReader(); rd.onload=function(){ S.draft=[{src:rd.result}]; S.savedAt=nowStr(); render(); toast(had?"Фото заменено":"Фото загружено"); }; rd.readAsDataURL(f); }
  if(t.id==="siteTg"){ S.site=t.checked; var n=document.getElementById("siteNote"); if(n) n.textContent=S.site?"Анкета показывается. Выключить можно в любой момент — страница исчезнет при ближайшем обновлении сайта.":"Анкета скрыта. В рейтинге и итогах вы остаётесь под публичным именем."; toast(S.site?"Анкета включена":"Анкета скрыта"); }
  if(t.dataset && t.dataset.chk){ var a=document.getElementById("c_rules"), b2=document.getElementById("c_pub"), bt=document.getElementById("applyBtn"); var ok=a&&b2&&a.checked&&b2.checked; if(bt){ bt.disabled=!ok; bt.textContent=ok?"Оставить заявку":"Отметьте оба пункта"; } }
  if(t.id==="n4"){ S.mkt=t.checked; toast(S.mkt?"Подписка на новости включена":"Подписка на новости выключена"); }
  if(t.id==="n2"){ toast(t.checked?"Email-напоминания включены":"Email-напоминания выключены"); }
});

  var iMax=ys.indexOf(hi), iMin=ys.lastIndexOf(lo), mark={}; mark[0]=1; mark[n-1]=1; if(many){ [iMax,iMin].forEach(function(i){ if(i>3&&i<n-4) mark[i]=1; }); }

  if(sc==="done_pending") return '<section class="card disc-p"><h2>Скидка в магазине</h2><p>Код скидки придёт вместе с номером диплома — в течение дня после публикации итогов.</p></section>';
