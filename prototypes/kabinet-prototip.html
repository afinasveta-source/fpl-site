<title>Кабинет участника FPL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;500;600&display=swap">
<style>
/* Layout: prototype strip on top; app header with burger on the right; on wide screens a left section rail + one content column (max 720px). */
:root{
  --bg:#F3EEE8; --surface:#FFFFFF; --sunk:#EBE4DC; --ink:#1E1B18; --muted:#6B625B; --line:#E2D9CF;
  --accent:#F2601F; --accent-ink:#B5420E; --accent-soft:#FCE6D9; --on-accent:#FFFFFF;
  --head:#1E1B18; --head-fg:#F3EEE8; --head-muted:#A99E94;
  --ok:#2E7A4E; --ok-soft:#DDF0E3; --warn:#9A6411; --warn-soft:#F8EBCF; --bad:#B3261E; --bad-soft:#F7DEDB; --info:#33598C; --info-soft:#DDE7F5;
  --proto:#2B2622; --proto-fg:#E9E1D8;
  --f-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1A1714; --surface:#25201C; --sunk:#2E2823; --ink:#F3EEE8; --muted:#A99E94; --line:#3A332D;
  --accent:#F2601F; --accent-ink:#FF9A66; --accent-soft:#3A2418; --on-accent:#FFFFFF;
  --head:#110F0D; --head-fg:#F3EEE8; --head-muted:#A99E94;
  --ok:#7BC897; --ok-soft:#1E3326; --warn:#E9B65E; --warn-soft:#3A2D14; --bad:#F08A80; --bad-soft:#3D1D1A; --info:#94B6E6; --info-soft:#1C2A3D;
  --proto:#0B0A09; --proto-fg:#D8CFC6; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1A1714; --surface:#25201C; --sunk:#2E2823; --ink:#F3EEE8; --muted:#A99E94; --line:#3A332D;
  --accent:#F2601F; --accent-ink:#FF9A66; --accent-soft:#3A2418; --on-accent:#FFFFFF;
  --head:#110F0D; --head-fg:#F3EEE8; --head-muted:#A99E94;
  --ok:#7BC897; --ok-soft:#1E3326; --warn:#E9B65E; --warn-soft:#3A2D14; --bad:#F08A80; --bad-soft:#3D1D1A; --info:#94B6E6; --info-soft:#1C2A3D;
  --proto:#0B0A09; --proto-fg:#D8CFC6; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font:500 15px/1.55 var(--f-body)}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
h1,h2,h3{font-family:var(--f-display); font-weight:500; letter-spacing:-.02em; text-wrap:balance; margin:0}
h1{font-size:clamp(25px,5.4vw,32px); line-height:1.12}
h2{font-size:18px; line-height:1.25}
h3{font-size:15px; line-height:1.3}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* прототип */
.proto{background:var(--proto); color:var(--proto-fg); font-size:13px; padding:8px 16px; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center}
.proto b{font:600 11px/1 var(--f-body); letter-spacing:.14em; text-transform:uppercase; color:var(--accent)}
.proto label{display:flex; gap:6px; align-items:center; min-width:0; max-width:100%}
.proto select{min-width:0; flex:1 1 auto; width:auto; background:transparent; border:1px solid #5A514A; border-radius:8px; padding:4px 8px; color:var(--proto-fg); max-width:100%}
.proto select option{color:#1E1B18}
.proto .ex{margin-left:auto; color:#A99E94}

/* шапка */
.hdr{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--head); color:var(--head-fg); display:flex; align-items:center; gap:12px; padding:10px 16px; min-height:56px}
.logo{font:600 18px/1 var(--f-display); color:var(--accent); letter-spacing:-.02em; text-decoration:none; background:none; border:0; padding:0; cursor:pointer}
.logo small{display:block; font:600 9px/1.4 var(--f-body); letter-spacing:.18em; color:var(--head-muted)}
.hdr .ctx{font-size:13px; color:var(--head-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1}
.bell{position:relative; background:none; border:0; color:var(--head-fg); width:40px; height:40px; border-radius:10px; cursor:pointer; display:grid; place-items:center}
.bell i{position:absolute; top:6px; right:6px; min-width:16px; height:16px; border-radius:8px; background:var(--accent); color:#fff; font:700 10px/16px var(--f-body); font-style:normal; padding:0 4px}
.burger{width:40px; height:40px; border-radius:10px; border:1px solid #4A423C; background:none; cursor:pointer; display:grid; place-content:center; gap:4px}
.burger span{display:block; width:18px; height:2px; background:var(--head-fg); border-radius:1px}

/* каркас */
.shell{display:grid; grid-template-columns:1fr; max-width:1120px; margin:0 auto}
.rail{display:none}
main{padding:18px 16px 64px; min-width:0; max-width:720px; width:100%; margin:0 auto; display:grid; gap:24px; align-content:start}
@media (min-width:920px){
  .shell{grid-template-columns:232px minmax(0,1fr); gap:24px; padding-inline:16px}
  .rail{display:block; position:sticky; top:72px; align-self:start; padding-top:20px}
  main{padding-inline:0}
  .burger{display:none}
}
.nav{display:grid; gap:2px}
.nav button{all:unset; box-sizing:border-box; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 12px; border-radius:10px; font-weight:600; font-size:14px; color:var(--ink)}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="page"]{background:var(--surface); box-shadow:inset 3px 0 0 var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .cnt{font:700 11px/18px var(--f-body); min-width:20px; text-align:center; border-radius:9px; background:var(--accent); color:#fff; padding:0 6px}
.nav .sep{height:1px; background:var(--line); margin:8px 4px}
.nav .out{color:var(--muted); font-weight:500}

/* выезжающее меню */
.drawer{position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.45); display:flex; justify-content:flex-end}
.drawer .panel{width:min(320px,86vw); background:var(--bg); height:100%; overflow:auto; padding:calc(14px + env(safe-area-inset-top,0px)) 14px 24px; display:grid; gap:12px; align-content:start}
.drawer .phead{display:flex; justify-content:space-between; align-items:center}
.x{width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:20px; line-height:1}

/* элементы */
.crumb{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:13px; color:var(--muted)}
.crumb button{all:unset; cursor:pointer; color:var(--muted); font-weight:600; text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px}
.crumb .up{text-decoration:none; color:var(--ink); font-size:18px; line-height:1; padding:2px 8px 4px; margin-left:-8px; border-radius:8px}
.crumb button:focus-visible{outline:2px solid var(--accent)}
.back{all:unset; cursor:pointer; font-weight:600; font-size:14px; color:var(--accent-ink); display:inline-flex; gap:6px; align-items:center}
.back:focus-visible{outline:2px solid var(--accent)}
.card{background:var(--surface); border:0; border-radius:var(--r); padding:18px; display:grid; gap:12px; min-width:0}
.lead{font-size:17px; line-height:1.55}
.focus{display:grid; gap:4px; padding:14px 16px; border-radius:var(--r); background:var(--accent-soft)}
.focus .lbl{font:700 12px/1 var(--f-body); color:var(--accent-ink)}
.focus .deadline .d{font-size:26px}
.card.hero{border:0; background:var(--head); color:var(--head-fg)}
.card.hero .muted{color:var(--head-muted)}
.card.hero .eyebrow{color:var(--head-muted)}
.card.hero h2{font-size:22px}
.eyebrow{font:600 11px/1.3 var(--f-body); letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.between{display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap}
.stack{display:grid; gap:10px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px}
.btn{appearance:none; border:0; border-radius:10px; padding:11px 16px; min-height:44px; font-weight:700; font-size:14px; cursor:pointer; background:var(--accent); color:var(--on-accent); display:inline-flex; align-items:center; justify-content:center; gap:8px; text-align:center}
.btn.sec{background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line)}
.card.hero .btn.sec{color:var(--head-fg); box-shadow:inset 0 0 0 1.5px #4A423C}
.btn.ghost{background:none; color:var(--ink); text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--line); padding-inline:4px; min-height:36px; font-weight:600}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn.wide{width:100%}
.pill{display:inline-flex; align-items:center; gap:6px; font:700 12px/1 var(--f-body); padding:6px 10px; border-radius:999px; background:var(--sunk); color:var(--ink); white-space:nowrap}
.pill::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.8}
.pill.ok{background:transparent; color:var(--ok); padding-inline:0} .pill.warn{background:var(--warn-soft); color:var(--warn)} .pill.bad{background:var(--bad-soft); color:var(--bad)} .pill.info{background:var(--info-soft); color:var(--info)} .pill.acc{background:var(--accent-soft); color:var(--accent-ink)}
.pill.plain::before{display:none}
.kv{align-content:start; display:grid; grid-template-columns:minmax(110px,38%) 1fr; gap:10px 14px; font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0; min-width:0}
.list{display:grid; border-top:1px solid var(--line)}
.li{all:unset; box-sizing:border-box; cursor:pointer; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; align-items:center; padding:14px 2px; border-bottom:1px solid var(--line)}
.li:hover .t{color:var(--accent-ink)}
.li:focus-visible{outline:2px solid var(--accent)}
.li .t{font-weight:700} .li .s{font-size:13px; color:var(--muted); grid-column:1} .li .r{grid-row:1 / span 2; grid-column:2; display:flex; gap:8px; align-items:center}
.li .r::after{content:"›"; font-size:20px; color:var(--muted)}
.li.static{cursor:default} .li.static .r::after{content:none}
.deadline{display:grid; gap:2px}
.deadline .d{font:500 22px/1.15 var(--f-display); letter-spacing:-.02em}
.deadline .tz{font-size:12px; color:var(--muted)}
.card.hero .deadline .tz{color:var(--head-muted)}
.note{border-radius:10px; padding:12px 14px; font-size:14px; background:var(--sunk)}
.note.warn{background:var(--warn-soft)} .note.bad{background:var(--bad-soft)} .note.ok{background:var(--ok-soft)} .note.info{background:var(--info-soft)}
.field{display:grid; gap:6px}
.field label{font-weight:700; font-size:14px}
.field .hint{font-size:12px; color:var(--muted)}
.field .err{font-size:13px; color:var(--bad); font-weight:600}
.input{width:100%; border:1.5px solid var(--line); background:var(--surface); border-radius:10px; padding:11px 12px; min-height:44px}
.input:focus{border-color:var(--accent); outline:none}
.input.bad{border-color:var(--bad)}
textarea.input{min-height:110px; resize:vertical}
.pw{position:relative} .pw .input{padding-right:84px}
.pw button{position:absolute; right:6px; top:6px; height:32px; border:0; background:var(--sunk); border-radius:8px; padding:0 10px; font-size:12px; font-weight:700; cursor:pointer}
.steps{list-style:none; margin:0; padding:0; display:grid; gap:0}
.steps li{display:grid; grid-template-columns:28px 1fr; gap:10px; padding:8px 0; position:relative}
.steps li .dot{width:22px; height:22px; border-radius:50%; border:2px solid var(--line); background:var(--surface); display:grid; place-items:center; font:700 11px var(--f-body); margin-top:1px}
.steps li.done .dot{background:var(--ok); border-color:var(--ok); color:#fff}
.steps li.now .dot{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft)}
.steps li:not(:last-child)::after{content:""; position:absolute; left:10px; top:32px; bottom:-6px; width:2px; background:var(--line)}
.tour{display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:12px; align-items:center}
.tour > div{min-width:0}
@media (max-width:520px){ .tour{grid-template-columns:44px minmax(0,1fr)} .tour .pill{grid-column:2; justify-self:start} }
.tour .no{width:44px; height:44px; border-radius:10px; background:var(--sunk); display:grid; place-items:center; font:600 15px var(--f-display)}
.tour.now .no{background:var(--accent); color:#fff}
.photo{aspect-ratio:4/5; max-width:100%; border-radius:10px; background:linear-gradient(150deg,var(--sunk),var(--line)); display:grid; place-items:center; color:var(--muted); font-size:13px; overflow:hidden; position:relative}
.photo img{width:100%; height:100%; object-fit:cover}
.photo .tag{position:absolute; left:8px; top:8px}
.thumbs{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px}
.drop{border:2px dashed var(--line); border-radius:12px; padding:22px; text-align:center; display:grid; gap:8px; justify-items:center; cursor:pointer}
.drop:hover{border-color:var(--accent)}
.score{font:500 40px/1 var(--f-display); letter-spacing:-.03em}
.score small{font:600 14px var(--f-body); color:var(--muted); letter-spacing:0}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px}
.stat{background:var(--sunk); border-radius:10px; padding:12px 14px; display:grid; gap:4px}
.stat b{font:500 20px/1.1 var(--f-display)} .stat span{font-size:12px; color:var(--muted)}
.bar{height:8px; border-radius:4px; background:var(--sunk); overflow:hidden} .bar i{display:block; height:100%; background:var(--accent)}
.msg{display:grid; gap:4px; max-width:88%; padding:10px 12px; border-radius:12px; background:var(--sunk); font-size:14px}
.msg.me{justify-self:end; background:var(--accent-soft)}
.msg .who{font-size:12px; color:var(--muted); font-weight:700}
.switch{display:flex; justify-content:space-between; gap:12px; align-items:center}
.tg{appearance:none; width:46px; height:28px; border-radius:14px; background:var(--line); position:relative; cursor:pointer; flex:none; border:0}
.tg::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:left .15s}
.tg:checked{background:var(--ok)} .tg:checked::after{left:21px}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:10px; font-weight:700; font-size:14px; z-index:60; max-width:calc(100% - 32px)}
.skel{height:14px; border-radius:6px; background:linear-gradient(90deg,var(--sunk),var(--line),var(--sunk)); background-size:200% 100%; animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){ .skel{animation:none} .tg::after{transition:none} }
.auth{max-width:440px; margin:0 auto; width:100%}
.modal{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.5); display:grid; place-items:center; padding:16px}
.modal .card{max-width:440px; width:100%}
/* нижняя панель (телефон) */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(5,1fr); padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tabbar button{all:unset; box-sizing:border-box; cursor:pointer; display:grid; justify-items:center; gap:2px; padding:6px 2px; border-radius:10px; font:700 11px/1.2 var(--f-body); color:var(--muted); position:relative; min-height:52px; align-content:center}
.tabbar button svg{width:22px; height:22px}
.tabbar button[aria-current="page"]{color:var(--accent-ink)}
.tabbar button:focus-visible{outline:2px solid var(--accent)}
.tabbar .cnt{position:absolute; top:4px; left:calc(50% + 6px); font:700 10px/16px var(--f-body); min-width:16px; height:16px; border-radius:8px; background:var(--accent); color:#fff; padding:0 4px; text-align:center}
.sheet{position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.45); display:flex; align-items:flex-end}
.sheet .panel{width:100%; background:var(--bg); border-radius:16px 16px 0 0; padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px)); display:grid; gap:10px}
.sheet .grip{width:40px; height:4px; border-radius:2px; background:var(--line); justify-self:center}
/* закреплённое действие */
.actbar{position:sticky; bottom:0; z-index:15; background:linear-gradient(transparent,var(--bg) 22%); padding-block:18px 12px; display:grid}
@media (max-width:919px){ .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))} main{padding-bottom:150px} .actbar{position:fixed; left:0; right:0; bottom:calc(61px + env(safe-area-inset-bottom,0px)); padding:18px 16px 10px} .hdr{min-height:52px} }
@media (min-width:920px){ .tabbar{display:none} }
/* крошки и согласия */
.crumb .up{font-weight:700}
.chk{display:grid; grid-template-columns:24px 1fr; gap:10px; align-items:start; font-size:14px; cursor:pointer}
.chk input{width:22px; height:22px; margin:1px 0 0; accent-color:var(--accent)}
.lnk{all:unset; cursor:pointer; color:var(--accent-ink); font-weight:700; text-decoration:underline; text-underline-offset:2px}
.lnk:focus-visible{outline:2px solid var(--accent)}
.photo.big{aspect-ratio:4/5; max-width:340px; width:100%}
details.more summary{cursor:pointer; font-weight:700; font-size:14px; color:var(--accent-ink); padding:6px 0}
details.more .kv{margin-top:8px}
.proto.min .opt{display:none}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
</style>

<div class="proto" role="region" aria-label="Управление прототипом">
  <b>Прототип</b>
  <label class="opt" for="scn">Сценарий
    <select id="scn">
      <option value="new">Новый участник, Игр нет</option>
      <option value="active" selected>Идёт тур, работу нужно сдать</option>
      <option value="sent">Работа сдана, ждём итог</option>
      <option value="out">Выбыл по оценке, идёт на зачёт и диплом</option>
      <option value="done">Игра завершена, итоги опубликованы</option>
    </select>
  </label>
  <label class="opt" for="net">Сеть
    <select id="net"><option value="ok">работает</option><option value="slow">медленная</option><option value="off">нет связи</option></select>
  </label>
  <button class="btn ghost opt" id="toLogin" type="button" style="color:var(--accent); min-height:28px">Экран входа</button>
  <span class="ex opt">Все данные — пример</span><button class="btn ghost" id="protoMin" type="button" style="color:var(--proto-fg); min-height:28px; padding:0 4px">Свернуть</button>
</div>

<div id="app"></div>

<script>
(function(){
"use strict";
var TZ = "МСК (UTC+3)";
var S = { scn:"active", net:"ok", route:"home", params:{}, hist:[], authed:true, welcomed:true,
  draft:[], drafts:{}, sentAt:null, applied:{}, tickets:null, readN:{}, site:false, mkt:false, name:"Анна Петрова", pname:"Анна П.", menu:false };
try{ var sv=JSON.parse(localStorage.getItem("fplProto")||"{}"); if(sv.scn) S.scn=sv.scn; }catch(e){}

/* ---------- данные-примеры ---------- */
function fmt(d){ return d; }
var GAME = { id:"g1", title:"Игра 01", season:"Сезон 1", type:"Рейтинговая Игра", period:"30 сентября — 26 октября 2026", rules:"Правила лиги, редакция 1.8" };
var NEXT = { id:"g2", title:"Игра 02", type:"Рейтинговая Игра", period:"9 — 30 ноября 2026", reg:"Регистрация до 7 ноября, 23:59 МСК", price:"1 500 ₽", priceNote:"Первая Игра для новых участников бесплатна", status:"open" };
var CH = { id:"c1", title:"Челлендж «Осенний лист»", type:"Открытый челлендж", period:"28 октября — 3 ноября 2026", reg:"Регистрация откроется 25 октября", price:"Бесплатно", status:"soon" };
var FIN = { id:"f1", title:"Суперфинал Сезона 1", type:"Финал сезона", period:"Февраль 2027", reg:"Доступ по итогам трёх Игр", price:"—", status:"closed" };

function tours(){
  var base = [

  } else body=(V[S.route]||V.home)(S.params||{});
  var hdr='<header class="hdr"><button class="logo" type="button" data-go="'+(auth?"login":"home")+'">FPL<small>КАБИНЕТ</small></button><span class="ctx"></span>'+
    (auth?'':'<button class="bell" type="button" data-go="notif" aria-label="Уведомления'+(unread()?', новых: '+unread():'')+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>'+(unread()?'<i>'+unread()+'</i>':'')+'</button>')+'</header>';
  app.innerHTML = hdr + (auth? '<main>'+body+'</main>' : '<div class="shell"><aside class="rail">'+navHTML()+'</aside><main id="main" tabindex="-1">'+crumbsFor(S.route,S.params)+body+'</main></div>'+tabbarHTML()) +
    (S.more&&!auth?moreHTML():'') +
    (false?'<div class="drawer" data-act="closeMenu"><div class="panel" role="dialog" aria-label="Меню"><div class="phead"><b>Меню</b><button class="x" type="button" data-act="closeMenu" aria-label="Закрыть меню">×</button></div>'+navHTML()+'</div></div>':'')+
    (!auth&&!S.welcomed?V.welcome():'');
  if(S.net==="slow" && !auth && S._slowOnce!==S.route){ S._slowOnce=S.route; var m=document.getElementById("main"); if(m){ var keep=m.innerHTML; m.innerHTML='<div class="stack" aria-busy="true"><div class="skel" style="width:40%"></div><div class="skel" style="height:120px"></div><div class="skel"></div><div class="skel" style="width:70%"></div></div>'; setTimeout(function(){ if(document.getElementById("main")) document.getElementById("main").innerHTML=keep; },900);} }
}
function go(r,p){ if(r==="task"&&p&&p.n&&p.n!==3){ var t=tours()[p.n-1]; if(t&&t.state==="pub") r="outcome"; }
  S.hist.push([S.route,S.params]); S.route=r; S.params=p||{}; S.menu=false; S.more=false; render(); var m=document.getElementById("main"); window.scrollTo(0,0); if(m) m.focus({preventScroll:true}); }

/* ---------- действия ---------- */
function nowStr(){ var d=new Date(); return "13 октября, "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
var A = {
  showpw:function(b){ var i=b.parentNode.querySelector("input"); var s=i.type==="password"; i.type=s?"text":"password"; b.textContent=s?"Скрыть":"Показать"; },
  activate:function(){ var a=document.getElementById("np1").value, b=document.getElementById("np2").value, e=document.getElementById("actErr");
    if(a.length<10){ e.hidden=false; e.textContent="Пароль короче 10 символов."; return; } if(a!==b){ e.hidden=false; e.textContent="Пароли не совпадают."; return; }
    withLoad(function(){ S.authed=true; S.welcomed=false; go("home"); }); },
  reset:function(){ withLoad(function(){ go("reset",{done:1}); }); },
  newpass:function(){ var a=document.getElementById("rp1").value, b=document.getElementById("rp2").value, e=document.getElementById("npErr");
    if(a.length<10){ e.hidden=false; e.textContent="Пароль короче 10 символов."; return; } if(a!==b){ e.hidden=false; e.textContent="Пароли не совпадают."; return; }
    withLoad(function(){ toast("Пароль сохранён. Войдите с новым паролем."); go("login"); }); },
  apply:function(b){ var id=b.getAttribute("data-id"); if(S.scn==="new"){ S.doc_rules=S.doc_rules||nowStr()+" МСК"; S.doc_pub=S.doc_pub||nowStr()+" МСК"; }
    withLoad(function(){ if(!S.applied[id]) S.applied[id]=nowStr()+" МСК"; go("applied",{id:id}); }); },
  acceptDoc:function(b){ var d=b.getAttribute("data-d"); withLoad(function(){ S["doc_"+d]=nowStr()+" МСК"; toast("Принято"); go("doc",{d:d}); }); },
  promo:function(){ var v=document.getElementById("promo").value.trim().toUpperCase(), h=document.getElementById("promoHint"); h.textContent = v==="FIRSTGAME" ? "Промокод применён: 0 ₽ вместо 1 500 ₽" : v ? "Такого промокода нет. Проверьте написание." : "Введите промокод."; h.style.color = v==="FIRSTGAME"?"var(--ok)":"var(--bad)"; },
  fakeAdd:function(){ withLoad(function(){ S.draft=[{src:null}]; S.savedAt=nowStr(); render(); toast("Фото загружено"); }); },
  rm:function(){ S.draft=[]; S.savedAt=nowStr(); render(); },
  main:function(b){ var i=+b.getAttribute("data-i"); var x=S.draft.splice(i,1)[0]; S.draft.unshift(x); render(); },
  submit:function(){ withLoad(function(){ S.sentAt=nowStr(); S.scn = S.scn==="out"?"out":"sent"; if(S.scn==="out"){ S.outSent=1; } document.getElementById("scn").value=S.scn; toast("Работа принята"); go("sent"); }); },
  openN:function(b){ var id=+b.getAttribute("data-id"); var n=NOTIFS().filter(function(x){return x.id===id})[0]; S.readN[id]=1; go(n.go, n.p||{n:3}); },
  readAll:function(){ NOTIFS().forEach(function(x){S.readN[x.id]=1}); render(); },
  reply:function(b){ var id=+b.getAttribute("data-id"), v=document.getElementById("rep").value.trim(); if(!v){ toast("Напишите текст ответа."); return; } if(!netGuard()) return;
    var t=tickets().filter(function(x){return x.id===id})[0]; var m={me:true,who:"Вы",at:nowStr(),x:v,pending:true}; t.msgs.push(m); render(); setTimeout(function(){ m.pending=false; t.st="wait_org"; render(); },S.net==="slow"?1500:500); },
  menu:function(){ S.menu=true; render(); }, more:function(){ S.more=true; render(); }, closeMore:function(b,e){ if(e.target===b){ S.more=false; render(); } }, closeMenu:function(b,e){ if(e.target===b||b.classList.contains("x")){ S.menu=false; render(); } },
  logout:function(){ S.authed=false; go("login"); },
  welcomeOk:function(){ S.welcomed=true; render(); }, welcomeHelp:function(){ S.welcomed=true; go("newticket",{ctx:"Первый вход"}); },
  retry:function(){ toast(S.net==="off"?"Связи всё ещё нет":"Обновлено"); },
  dl:function(){ toast("В прототипе файл не скачивается. В кабинете здесь будет PDF именно вашего диплома."); },
  soon:function(){ toast("Этот экран ещё проектируется."); },
  endAll:function(){ withLoad(function(){ toast("Другие устройства отключены"); }); }
};

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-go],[data-act]"); if(!el) return;
  if(el.hasAttribute("data-act")){ var a=el.getAttribute("data-act"); if(A[a]){ if(a!=="closeMenu") e.preventDefault(); A[a](el,e); } return; }
  var p=null; try{ p=JSON.parse(el.getAttribute("data-p")||"null"); }catch(x){}
  go(el.getAttribute("data-go"),p);
});
document.addEventListener("submit",function(e){ e.preventDefault(); var f=e.target;
  if(f.id==="fLogin"){ var pw=document.getElementById("pw").value, er=document.getElementById("loginErr");
    if(pw.length<6){ er.hidden=false; er.textContent="Неверный email или пароль. Проверьте раскладку или восстановите доступ."; document.getElementById("pw").classList.add("bad"); return; }
    withLoad(function(){ S.authed=true; go("home"); }); }
  if(f.id==="fTicket"){ var tx=document.getElementById("tx").value.trim(), tt=document.getElementById("tt").value.trim(), te=document.getElementById("tErr");
    if(!tx){ te.hidden=false; te.textContent="Опишите вопрос — без текста обращение не отправить."; return; }
    withLoad(function(){ var id=230+tickets().length; var ctx=(S.params&&S.params.ctx)||(document.getElementById("tctx")?document.getElementById("tctx").value:"Общий вопрос");
      tickets().unshift({id:id,t:tt||tx.slice(0,60),ctx:ctx,st:"wait_org",d:nowStr().split(",")[0],msgs:[{me:true,who:"Вы",at:nowStr(),x:tx}]}); toast("Обращение №"+id+" создано"); go("ticket",{id:id}); }); }
  if(f.id==="fName"){ var v=document.getElementById("pn").value.trim(), er2=document.getElementById("pnErr");
    if(v.length<2){ er2.hidden=false; er2.textContent="Слишком коротко: нужно от 2 символов."; return; }
    withLoad(function(){ S.pname=v; toast("Сохранено. Новое имя появится на сайте при ближайшем обновлении."); go("profile"); }); }
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="scn"){ S.scn=t.value; S.draft=[]; S.outSent=0; S.applied={}; S.readN={}; S.hist=[]; S.route="home"; S.params={}; try{localStorage.setItem("fplProto",JSON.stringify({scn:S.scn}))}catch(x){} render(); }
  if(t.id==="net"){ S.net=t.value; S._slowOnce=null; render(); }
  if(t.id==="file" && t.files && t.files[0]){ var f=t.files[0]; if(f.size>20*1024*1024){ toast("Файл больше 20 МБ. Выберите другой."); return; } if(!netGuard()) return;
    var had=S.draft.length; var rd=new FileReader(); rd.onload=function(){ S.draft=[{src:rd.result}]; S.savedAt=nowStr(); render(); toast(had?"Фото заменено":"Фото загружено"); }; rd.readAsDataURL(f); }
  if(t.id==="siteTg"){ S.site=t.checked; var n=document.getElementById("siteNote"); if(n) n.textContent=S.site?"Анкета показывается. Выключить можно в любой момент — страница исчезнет при ближайшем обновлении сайта.":"Анкета скрыта. В рейтинге и итогах вы остаётесь под публичным именем."; toast(S.site?"Анкета включена":"Анкета скрыта"); }
  if(t.dataset && t.dataset.chk){ var a=document.getElementById("c_rules"), b2=document.getElementById("c_pub"), bt=document.getElementById("applyBtn"); var ok=a&&b2&&a.checked&&b2.checked; if(bt){ bt.disabled=!ok; bt.textContent=ok?"Оставить заявку":"Отметьте оба пункта"; } }
  if(t.id==="n4"){ S.mkt=t.checked; toast(S.mkt?"Подписка на новости включена":"Подписка на новости выключена"); }
  if(t.id==="n2"){ toast(t.checked?"Email-напоминания включены":"Email-напоминания выключены"); }
});
document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&(S.menu||S.more)){ S.menu=false; S.more=false; render(); } });
document.getElementById("scn").value=S.scn;
document.getElementById("protoMin").addEventListener("click",function(){ var pr=document.querySelector(".proto"); var m=pr.classList.toggle("min"); this.textContent=m?"Показать настройки прототипа":"Свернуть"; });
document.getElementById("toLogin").addEventListener("click",function(){ go("login"); });
render();
})();
</script>
