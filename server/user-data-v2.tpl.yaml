- path: /opt/fpl/fpl-ingest.py
  permissions: '0755'
  content: |
    #!/usr/bin/env python3
    """FPL: приёмник данных из бота.

    POST /api/ingest?name=<набор>[&part=<i>&parts=<n>]
      Ключ: заголовок X-FPL-Key, или параметр key в адресе, или поле key в теле.
      Тело: JSON, или форма с полем data (строка JSON).
      Набор из нескольких частей: каждая часть — JSON-массив; когда пришли все n частей,
      они склеиваются в один массив.
      Результат: /var/lib/fpl/data/<набор>.json (атомарная замена), сайт отдаёт его как /data/<набор>.json.
      Наборы с именем private-… сохраняются в /var/lib/fpl/private/ — сайт их НЕ отдаёт
      (например, private-photos: список фото работ для архива, см. fpl-photo-archive.py).
    GET /api/health -> {"ok": true}
    """
    import json, os, re, time, tempfile, urllib.parse
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    DATA = os.environ.get('FPL_DATA', '/var/lib/fpl/data')
    PRIVATE = os.environ.get('FPL_PRIVATE', '/var/lib/fpl/private')
    PARTS = os.environ.get('FPL_PARTS', '/var/lib/fpl/parts')
    KEY = os.environ.get('FPL_INGEST_KEY', '')
    MAX = 5 * 1024 * 1024
    NAME = re.compile(r'^[a-z0-9_-]{1,40}$')


    def target_dir(name):
        return PRIVATE if name.startswith('private-') else DATA


    def write_atomic(path, obj):
        os.makedirs(os.path.dirname(path), exist_ok=True)
        fd, tmp = tempfile.mkstemp(dir=os.path.dirname(path))
        with os.fdopen(fd, 'w', encoding='utf-8') as f:
            json.dump(obj, f, ensure_ascii=False, separators=(',', ':'))
        os.chmod(tmp, 0o600 if path.startswith(PRIVATE) else 0o644)
        os.replace(tmp, path)


    class H(BaseHTTPRequestHandler):
        server_version = 'fpl'

        def reply(self, code, obj):
            b = json.dumps(obj, ensure_ascii=False).encode()
            self.send_response(code)
            self.send_header('Content-Type', 'application/json; charset=utf-8')
            self.send_header('Content-Length', str(len(b)))
            self.end_headers()
            self.wfile.write(b)

        def log_message(self, fmt, *a):
            print('%s %s' % (self.address_string(), fmt % a), flush=True)

        def do_GET(self):
            if self.path.split('?')[0] == '/api/health':
                return self.reply(200, {'ok': True})
            self.reply(404, {'ok': False})

        def do_POST(self):
            u = urllib.parse.urlparse(self.path)
            if u.path != '/api/ingest':
                return self.reply(404, {'ok': False})
            q = {k: v[0] for k, v in urllib.parse.parse_qs(u.query).items()}
            n = int(self.headers.get('Content-Length') or 0)
            if n > MAX:
                return self.reply(413, {'ok': False, 'error': 'too_large'})
            raw = self.rfile.read(n).decode('utf-8', 'replace')
            ctype = (self.headers.get('Content-Type') or '').lower()
            body, form = None, {}
            try:
                if 'json' in ctype or raw.lstrip()[:1] in ('{', '['):
                    body = json.loads(raw)
                    if isinstance(body, dict) and 'data' in body and set(body) <= {'data', 'key', 'name', 'part', 'parts'}:
                        form = body
                        body = body['data']
                        if isinstance(body, str):
                            body = json.loads(body)
                else:
                    form = {k: v[0] for k, v in urllib.parse.parse_qs(raw).items()}
                    body = json.loads(form.get('data', 'null'))
            except Exception:
                return self.reply(400, {'ok': False, 'error': 'bad_json'})
            key = self.headers.get('X-FPL-Key') or q.get('key') or form.get('key') or ''
            if not KEY or key != KEY:
                return self.reply(403, {'ok': False, 'error': 'bad_key'})
            name = q.get('name') or form.get('name') or ''
            if not NAME.match(name):
                return self.reply(400, {'ok': False, 'error': 'bad_name'})
            try:
                part = int(q.get('part') or form.get('part') or 1)
                parts = int(q.get('parts') or form.get('parts') or 1)
            except ValueError:
                return self.reply(400, {'ok': False, 'error': 'bad_part'})
            if not (1 <= part <= parts <= 200):
                return self.reply(400, {'ok': False, 'error': 'bad_part'})
            if parts == 1:
                write_atomic(os.path.join(target_dir(name), name + '.json'), body)
                return self.reply(200, {'ok': True, 'name': name, 'rows': len(body) if isinstance(body, list) else None})
            if not isinstance(body, list):
                return self.reply(400, {'ok': False, 'error': 'part_not_list'})
            d = os.path.join(PARTS, name)
            os.makedirs(d, exist_ok=True)
            # новая серия частей: части от прошлой загрузки (старше 1 часа или с другим числом частей) удаляются
            for f in os.listdir(d):
                p = os.path.join(d, f)
                if not f.startswith('%d-' % parts) or time.time() - os.path.getmtime(p) > 3600:
                    os.remove(p)
            write_atomic(os.path.join(d, '%d-%03d.json' % (parts, part)), body)
            got = sorted(f for f in os.listdir(d) if f.startswith('%d-' % parts))
            if len(got) < parts:
                return self.reply(200, {'ok': True, 'name': name, 'part': part, 'received': len(got), 'parts': parts})
            rows = []
            for f in got:
                with open(os.path.join(d, f), encoding='utf-8') as fh:
                    rows.extend(json.load(fh))
                os.remove(os.path.join(d, f))
            write_atomic(os.path.join(target_dir(name), name + '.json'), rows)
            self.reply(200, {'ok': True, 'name': name, 'rows': len(rows), 'complete': True})


    if __name__ == '__main__':
        os.makedirs(DATA, exist_ok=True)
        os.makedirs(PRIVATE, mode=0o700, exist_ok=True)
        ThreadingHTTPServer(('127.0.0.1', int(os.environ.get('FPL_PORT', '8081'))), H).serve_forever()
- path: /etc/systemd/system/fpl-ingest.service
  content: '[Unit]

    Description=FPL ingest (данные из бота)

    After=network.target


    [Service]

    EnvironmentFile=/etc/fpl-ingest.env

    Environment=FPL_PRIVATE=/var/lib/fpl/private FPL_DATA=/var/lib/fpl/data FPL_PARTS=/var/lib/fpl/parts FPL_PORT=8081

    ExecStart=/usr/bin/python3 /opt/fpl/fpl-ingest.py

    User=www-data

    Restart=always

    RestartSec=3


    [Install]

    WantedBy=multi-user.target

    '
- path: /usr/local/bin/fpl-photo-archive
  permissions: '0755'
  content: |
    #!/usr/bin/env python3
    """FPL: архив фото работ (cron, каждые 10 минут).

    Бот присылает список фото в закрытый набор: POST /api/ingest?name=private-photos[...]
      [{"key": "fpl_game1_2026/r2/work/123", "url": "https://sun9-…userapi.com/…jpg"}, …]
      key — постоянный идентификатор работы (марафон / тур / трек / номер), url — где фото сейчас.
    Наборов может быть несколько: private-photos, private-photos-free, private-photos-cards …
    (все файлы /var/lib/fpl/private/private-photos*.json).

    Архиватор скачивает каждое ещё не сохранённое фото в /var/lib/fpl/archive/files/<sha256>.<ext>
    (папка не отдаётся сайтом), записывает журнал /var/lib/fpl/archive/index.json
    и повторяет неудачные попытки (до MAX_ATTEMPTS). Если по тому же key пришла новая ссылка
    (работу заменили), сохраняется и новая версия.
    Наружу публикуется только сводка без ссылок и имён: /var/lib/fpl/data/photo-archive-status.json.
    """
    import glob, hashlib, json, os, shutil, sys, tempfile, time, urllib.request

    PRIVATE = os.environ.get('FPL_PRIVATE', '/var/lib/fpl/private')
    ARCHIVE = os.environ.get('FPL_ARCHIVE', '/var/lib/fpl/archive')
    DATA = os.environ.get('FPL_DATA', '/var/lib/fpl/data')
    MAX_BYTES = 25 * 1024 * 1024
    MAX_ATTEMPTS = 6
    MIN_FREE = int(os.environ.get('FPL_ARCHIVE_MIN_FREE', str(800 * 1024 * 1024)))
    PER_RUN = int(os.environ.get('FPL_ARCHIVE_PER_RUN', '300'))
    TIMEOUT = 30
    MAGIC = [(b'\xff\xd8\xff', 'jpg'), (b'\x89PNG\r\n\x1a\n', 'png'), (b'RIFF', 'webp'), (b'GIF8', 'gif')]


    def now():
        return time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())


    def write_json(path, obj, mode=0o600):
        os.makedirs(os.path.dirname(path), exist_ok=True)
        fd, tmp = tempfile.mkstemp(dir=os.path.dirname(path))
        with os.fdopen(fd, 'w', encoding='utf-8') as f:
            json.dump(obj, f, ensure_ascii=False, indent=0)
        os.chmod(tmp, mode)
        os.replace(tmp, path)


    def kind(data):
        for sig, ext in MAGIC:
            if data.startswith(sig) and (ext != 'webp' or data[8:12] == b'WEBP'):
                return ext
        if data[4:12] in (b'ftypheic', b'ftypheix', b'ftypmif1'):
            return 'heic'
        return None


    def fetch(url):
        req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (FPL photo archive)'})
        with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
            if r.status != 200:
                raise ValueError('http %s' % r.status)
            data = r.read(MAX_BYTES + 1)
        if len(data) > MAX_BYTES:
            raise ValueError('too large')
        ext = kind(data)
        if not ext:
            raise ValueError('not an image')
        return data, ext


    def load_queue():
        items = {}
        for path in sorted(glob.glob(os.path.join(PRIVATE, 'private-photos*.json'))):
            try:
                rows = json.load(open(path, encoding='utf-8'))
            except Exception as e:
                print('skip %s: %s' % (os.path.basename(path), e), file=sys.stderr)
                continue
            for row in rows if isinstance(rows, list) else []:
                if not isinstance(row, dict):
                    continue
                key, url = str(row.get('key') or '').strip(), str(row.get('url') or '').strip()
                if key and url.startswith(('http://', 'https://')):
                    items[(key, url)] = row
        return items


    def main():
        os.makedirs(os.path.join(ARCHIVE, 'files'), mode=0o700, exist_ok=True)
        idx_path = os.path.join(ARCHIVE, 'index.json')
        try:
            index = json.load(open(idx_path, encoding='utf-8'))
        except FileNotFoundError:
            index = {}
        # index: "<key>\n<url>" -> {key,url,status,sha256,file,bytes,attempts,first_seen,last_try,error}
        queue = load_queue()
        for (key, url) in queue:
            index.setdefault(key + '\n' + url, {'key': key, 'url': url, 'status': 'pending', 'attempts': 0, 'first_seen': now()})

        done = 0
        for rec in sorted(index.values(), key=lambda r: r['first_seen']):
            if rec['status'] == 'archived' or rec['attempts'] >= MAX_ATTEMPTS or done >= PER_RUN:
                continue
            if shutil.disk_usage(ARCHIVE).free < MIN_FREE:
                print('low disk space, stopping', file=sys.stderr)
                break
            rec['attempts'] += 1
            rec['last_try'] = now()
            done += 1
            try:
                data, ext = fetch(rec['url'])
            except Exception as e:
                rec['error'] = str(e)[:200]
                rec['status'] = 'lost' if rec['attempts'] >= MAX_ATTEMPTS else 'retry'
                continue
            sha = hashlib.sha256(data).hexdigest()
            name = sha + '.' + ext
            path = os.path.join(ARCHIVE, 'files', name)
            if not os.path.exists(path):
                fd, tmp = tempfile.mkstemp(dir=os.path.dirname(path))
                with os.fdopen(fd, 'wb') as f:
                    f.write(data)
                os.chmod(tmp, 0o600)
                os.replace(tmp, path)
            rec.update(status='archived', sha256=sha, file=name, bytes=len(data), archived_at=now())
            rec.pop('error', None)
            if done % 25 == 0:
                write_json(idx_path, index)
        write_json(idx_path, index)

        st = {'updated_at': now(), 'items': len(index),
              'archived': sum(r['status'] == 'archived' for r in index.values()),
              'pending': sum(r['status'] in ('pending', 'retry') for r in index.values()),
              'lost': sum(r['status'] == 'lost' for r in index.values()),
              'works': len({r['key'] for r in index.values()}),
              'works_without_copy': len({r['key'] for r in index.values()} - {r['key'] for r in index.values() if r['status'] == 'archived'}),
              'disk_free_mb': shutil.disk_usage(ARCHIVE).free // (1024 * 1024)}
        write_json(os.path.join(DATA, 'photo-archive-status.json'), st, mode=0o644)
        print(json.dumps(st, ensure_ascii=False))


    if __name__ == '__main__':
        main()
- path: /usr/local/bin/fpl-sync
  permissions: '0755'
  content: |
    #!/bin/bash
    # fpl-sync (cron, каждые 5 мин): забрать сайт и подменить папку сайта, если он изменился.
    # Источник — /etc/fpl.env:
    #   ZIP_URL   архив (GitHub: https://codeload.github.com/afinasveta-source/fpl-site/zip/refs/heads/main)
    #   SHA_URL   необязательно: адрес, отдающий номер последнего коммита — тогда архив качается только при новом коммите
    #   SITE_DIR  необязательно: папка сайта внутри архива (GitHub: fpl-site-main/dist); без неё — fpl-site/ или корень архива
    set -e
    . /etc/fpl.env
    mkdir -p /var/lib/fpl /var/www/fpl
    cd /var/lib/fpl
    live_ok() { [ -e /var/www/fpl/current/index.html ] && [ "$(readlink /var/www/fpl/current)" != /var/www/fpl/placeholder ]; }

    sha=
    if [ -n "$SHA_URL" ]; then
      sha=$(curl -sS -f -m 20 -H 'Accept: application/vnd.github.sha' "$SHA_URL") || exit 0
      [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 0
      if [ -f sha ] && [ "$(cat sha)" = "$sha" ] && live_ok; then exit 0; fi
      etag=()
    else
      etag=(--etag-compare etag --etag-save etag.new)
    fi

    code=$(curl -sS -L -m 180 -o site.zip.new -w '%{http_code}' "${etag[@]}" "$ZIP_URL") || { rm -f site.zip.new etag.new; exit 0; }
    [ "$code" = "200" ] || { rm -f site.zip.new etag.new; exit 0; }
    [ -f etag.new ] && mv etag.new etag
    if [ -f site.zip ] && cmp -s site.zip site.zip.new && live_ok; then
      rm -f site.zip.new; [ -z "$sha" ] || echo "$sha" > sha; exit 0
    fi

    rm -rf unpack && mkdir unpack && unzip -q site.zip.new -d unpack
    src=unpack
    if [ -n "$SITE_DIR" ]; then src=unpack/$SITE_DIR
    elif [ -d unpack/fpl-site ]; then src=unpack/fpl-site; fi
    if [ ! -f "$src/index.html" ]; then
      logger "fpl-sync: в архиве нет $src/index.html — сайт не тронут"; rm -f site.zip.new etag; exit 1
    fi
    new=/var/www/fpl/rel-$(date +%s%N)
    cp -r "$src" "$new"
    [ -z "$sha" ] || echo "$sha" > "$new/version.txt"
    chmod -R a+rX "$new"
    ln -sfn "$new" /var/www/fpl/current
    ls -dt /var/www/fpl/rel-* | tail -n +4 | xargs -r rm -rf
    mv site.zip.new site.zip
    [ -z "$sha" ] || echo "$sha" > sha
    logger "fpl-sync: сайт обновлён ($new${sha:+, коммит ${sha:0:7}})"
- path: /usr/local/bin/fpl-ops
  permissions: '0755'
  content: '#!/bin/bash

    # канал обновлений сервера: архив fpl-ops из хранилища с файлом apply.sh внутри

    set -e

    . /etc/fpl.env

    mkdir -p /var/lib/fpl/ops

    cd /var/lib/fpl

    code=$(curl -sS -L -o ops.tgz.new -w ''%{http_code}'' --etag-compare ops.etag --etag-save ops.etag.new "$OPS_URL") || exit 0

    [ "$code" = "200" ] || { rm -f ops.tgz.new ops.etag.new; exit 0; }

    mv ops.etag.new ops.etag

    if [ -f ops.tgz ] && cmp -s ops.tgz ops.tgz.new; then rm -f ops.tgz.new; exit 0; fi

    d=/var/lib/fpl/ops/rel-$(date +%s)

    mkdir -p "$d" && tar -xzf ops.tgz.new -C "$d"

    mv ops.tgz.new ops.tgz

    [ -f "$d/apply.sh" ] || { logger "fpl-ops: нет apply.sh"; exit 1; }

    ( cd "$d" && bash apply.sh ) >> /var/log/fpl-ops.log 2>&1 && logger "fpl-ops: применено $d" || logger "fpl-ops: ОШИБКА $d"

    '
- path: /usr/local/bin/fpl-cert
  permissions: '0755'
  content: "#!/bin/bash\n# выпустить HTTPS-сертификат, когда домен и www указывают на этот сервер\n. /etc/fpl.env\n[ -d /etc/letsencrypt/live/$DOMAIN ] && exit 0\nip=$(curl -s https://api.ipify.org)\n[ \"$(dig +short A $DOMAIN @1.1.1.1 | tail -1)\" = \"$ip\" ] || exit 0\n[ \"$(dig +short A www.$DOMAIN @1.1.1.1 | tail -1)\" = \"$ip\" ] || exit 0\ncertbot --nginx -n --agree-tos --register-unsafely-without-email --redirect \\\n  -d $DOMAIN -d www.$DOMAIN && logger \"fpl-cert: сертификат выпущен\"\n"
- path: /etc/nginx/sites-available/fpl
  content: "server {\n  listen 80 default_server;\n  listen [::]:80 default_server;\n  server_name facepaintingleague.com www.facepaintingleague.com _;\n  root /var/www/fpl/current;\n  index index.html;\n  charset utf-8;\n  client_max_body_size 6m;\n\n  # основной адрес — без www\n  if ($host = www.facepaintingleague.com) { return 301 $scheme://facepaintingleague.com$request_uri; }\n\n  location / { try_files $uri $uri/ $uri.html =404; }\n  location /assets/ { expires 7d; add_header Cache-Control \"public\"; }\n  location ~* \\.html$ { add_header Cache-Control \"no-cache\"; }\n  # данные из бота\n  location /data/ { alias /var/lib/fpl/data/; add_header Cache-Control \"no-cache\"; default_type application/json; }\n  location /media/ { alias /var/lib/fpl/media/; expires 30d; }\n  # приёмник данных из бота\n  location /api/ { proxy_pass http://127.0.0.1:8081; proxy_set_header Host $host; proxy_read_timeout 60s; }\n  error_page 404 /404.html;\n\n  gzip on; gzip_types text/css application/javascript\
    \ application/json image/svg+xml text/plain application/xml;\n  add_header X-Content-Type-Options nosniff;\n  server_tokens off;\n}\n"
