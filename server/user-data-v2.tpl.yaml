- path: /etc/fpl-ingest.env
  permissions: '0600'
  content: 'FPL_INGEST_KEY=***

    '
- path: /opt/fpl/fpl-ingest.py
  permissions: '0755'
  content: "#!/usr/bin/env python3\n\"\"\"FPL: приёмник данных из бота.\n\nPOST /api/ingest?name=<набор>[&part=<i>&parts=<n>]\n  Ключ: заголовок X-FPL-Key, или параметр key в адресе, или поле key в теле.\n  Тело: JSON, или форма с полем data (строка JSON).\n  Набор из нескольких частей: каждая часть — JSON-массив; когда пришли все n частей,\n  они склеиваются в один массив.\n  Результат: /var/lib/fpl/data/<набор>.json (атомарная замена), сайт отдаёт его как /data/<набор>.json.\nGET /api/health -> {\"ok\": true}\n\"\"\"\nimport json, os, re, time, tempfile, urllib.parse\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\n\nDATA = os.environ.get('FPL_DATA', '/var/lib/fpl/data')\nPARTS = os.environ.get('FPL_PARTS', '/var/lib/fpl/parts')\nKEY = os.environ.get('FPL_INGEST_KEY', '')\nMAX = 5 * 1024 * 1024\nNAME = re.compile(r'^[a-z0-9_-]{1,40}$')\n\n\ndef write_atomic(path, obj):\n    os.makedirs(os.path.dirname(path), exist_ok=True)\n    fd, tmp = tempfile.mkstemp(dir=os.path.dirname(path))\n\
    \    with os.fdopen(fd, 'w', encoding='utf-8') as f:\n        json.dump(obj, f, ensure_ascii=False, separators=(',', ':'))\n    os.chmod(tmp, 0o644)\n    os.replace(tmp, path)\n\n\nclass H(BaseHTTPRequestHandler):\n    server_version = 'fpl'\n\n    def reply(self, code, obj):\n        b = json.dumps(obj, ensure_ascii=False).encode()\n        self.send_response(code)\n        self.send_header('Content-Type', 'application/json; charset=utf-8')\n        self.send_header('Content-Length', str(len(b)))\n        self.end_headers()\n        self.wfile.write(b)\n\n    def log_message(self, fmt, *a):\n        print('%s %s' % (self.address_string(), fmt % a), flush=True)\n\n    def do_GET(self):\n        if self.path.split('?')[0] == '/api/health':\n            return self.reply(200, {'ok': True})\n        self.reply(404, {'ok': False})\n\n    def do_POST(self):\n        u = urllib.parse.urlparse(self.path)\n        if u.path != '/api/ingest':\n            return self.reply(404, {'ok': False})\n\
    \        q = {k: v[0] for k, v in urllib.parse.parse_qs(u.query).items()}\n        n = int(self.headers.get('Content-Length') or 0)\n        if n > MAX:\n            return self.reply(413, {'ok': False, 'error': 'too_large'})\n        raw = self.rfile.read(n).decode('utf-8', 'replace')\n        ctype = (self.headers.get('Content-Type') or '').lower()\n        body, form = None, {}\n        try:\n            if 'json' in ctype or raw.lstrip()[:1] in ('{', '['):\n                body = json.loads(raw)\n                if isinstance(body, dict) and 'data' in body and set(body) <= {'data', 'key', 'name', 'part', 'parts'}:\n                    form = body\n                    body = body['data']\n                    if isinstance(body, str):\n                        body = json.loads(body)\n            else:\n                form = {k: v[0] for k, v in urllib.parse.parse_qs(raw).items()}\n                body = json.loads(form.get('data', 'null'))\n        except Exception:\n            return\
    \ self.reply(400, {'ok': False, 'error': 'bad_json'})\n        key = self.headers.get('X-FPL-Key') or q.get('key') or form.get('key') or ''\n        if not KEY or key != KEY:\n            return self.reply(403, {'ok': False, 'error': 'bad_key'})\n        name = q.get('name') or form.get('name') or ''\n        if not NAME.match(name):\n            return self.reply(400, {'ok': False, 'error': 'bad_name'})\n        try:\n            part = int(q.get('part') or form.get('part') or 1)\n            parts = int(q.get('parts') or form.get('parts') or 1)\n        except ValueError:\n            return self.reply(400, {'ok': False, 'error': 'bad_part'})\n        if not (1 <= part <= parts <= 200):\n            return self.reply(400, {'ok': False, 'error': 'bad_part'})\n        if parts == 1:\n            write_atomic(os.path.join(DATA, name + '.json'), body)\n            return self.reply(200, {'ok': True, 'name': name, 'rows': len(body) if isinstance(body, list) else None})\n        if not isinstance(body,\
    \ list):\n            return self.reply(400, {'ok': False, 'error': 'part_not_list'})\n        d = os.path.join(PARTS, name)\n        os.makedirs(d, exist_ok=True)\n        # новая серия частей: части от прошлой загрузки (старше 1 часа или с другим числом частей) удаляются\n        for f in os.listdir(d):\n            p = os.path.join(d, f)\n            if not f.startswith('%d-' % parts) or time.time() - os.path.getmtime(p) > 3600:\n                os.remove(p)\n        write_atomic(os.path.join(d, '%d-%03d.json' % (parts, part)), body)\n        got = sorted(f for f in os.listdir(d) if f.startswith('%d-' % parts))\n        if len(got) < parts:\n            return self.reply(200, {'ok': True, 'name': name, 'part': part, 'received': len(got), 'parts': parts})\n        rows = []\n        for f in got:\n            with open(os.path.join(d, f), encoding='utf-8') as fh:\n                rows.extend(json.load(fh))\n            os.remove(os.path.join(d, f))\n        write_atomic(os.path.join(DATA,\
    \ name + '.json'), rows)\n        self.reply(200, {'ok': True, 'name': name, 'rows': len(rows), 'complete': True})\n\n\nif __name__ == '__main__':\n    os.makedirs(DATA, exist_ok=True)\n    ThreadingHTTPServer(('127.0.0.1', int(os.environ.get('FPL_PORT', '8081'))), H).serve_forever()\n"
- path: /etc/systemd/system/fpl-ingest.service
  content: '[Unit]

    Description=FPL ingest (данные из бота)

    After=network.target


    [Service]

    EnvironmentFile=/etc/fpl-ingest.env

    Environment=FPL_DATA=/var/lib/fpl/data FPL_PARTS=/var/lib/fpl/parts FPL_PORT=8081

    ExecStart=/usr/bin/python3 /opt/fpl/fpl-ingest.py

    User=www-data

    Restart=always

    RestartSec=3


    [Install]

    WantedBy=multi-user.target

    '
- path: /usr/local/bin/fpl-sync
  permissions: '0755'
  content: |
    #!/bin/bash
    # fpl-sync (cron, каждые 5 мин): забрать сайт и подменить папку сайта, если он изменился.
    # Источник — /etc/fpl.env:
    #   ZIP_URL   архив (GitHub: https://codeload.github.com/afinasveta-source/fpl-site/zip/refs/heads/main)
    #   SHA_URL   необязательно: адрес, отдающий номер последнего коммита — тогда архив качается только при новом коммите
    #   SITE_DIR  необязательно: папка сайта внутри архива (GitHub: fpl-site-main/dist); без неё — fpl-site/ или корень архива
    set -e
    . /etc/fpl.env
    mkdir -p /var/lib/fpl /var/www/fpl
    cd /var/lib/fpl
    live_ok() { [ -e /var/www/fpl/current/index.html ] && [ "$(readlink /var/www/fpl/current)" != /var/www/fpl/placeholder ]; }

    sha=
    if [ -n "$SHA_URL" ]; then
      sha=$(curl -sS -f -m 20 -H 'Accept: application/vnd.github.sha' "$SHA_URL") || exit 0
      [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 0
      if [ -f sha ] && [ "$(cat sha)" = "$sha" ] && live_ok; then exit 0; fi
      etag=()
    else
      etag=(--etag-compare etag --etag-save etag.new)
    fi

    code=$(curl -sS -L -m 180 -o site.zip.new -w '%{http_code}' "${etag[@]}" "$ZIP_URL") || { rm -f site.zip.new etag.new; exit 0; }
    [ "$code" = "200" ] || { rm -f site.zip.new etag.new; exit 0; }
    [ -f etag.new ] && mv etag.new etag
    if [ -f site.zip ] && cmp -s site.zip site.zip.new && live_ok; then
      rm -f site.zip.new; [ -z "$sha" ] || echo "$sha" > sha; exit 0
    fi

    rm -rf unpack && mkdir unpack && unzip -q site.zip.new -d unpack
    src=unpack
    if [ -n "$SITE_DIR" ]; then src=unpack/$SITE_DIR
    elif [ -d unpack/fpl-site ]; then src=unpack/fpl-site; fi
    if [ ! -f "$src/index.html" ]; then
      logger "fpl-sync: в архиве нет $src/index.html — сайт не тронут"; rm -f site.zip.new etag; exit 1
    fi
    new=/var/www/fpl/rel-$(date +%s%N)
    cp -r "$src" "$new"
    [ -z "$sha" ] || echo "$sha" > "$new/version.txt"
    chmod -R a+rX "$new"
    ln -sfn "$new" /var/www/fpl/current
    ls -dt /var/www/fpl/rel-* | tail -n +4 | xargs -r rm -rf
    mv site.zip.new site.zip
    [ -z "$sha" ] || echo "$sha" > sha
    logger "fpl-sync: сайт обновлён ($new${sha:+, коммит ${sha:0:7}})"
- path: /usr/local/bin/fpl-ops
  permissions: '0755'
  content: '#!/bin/bash

    # канал обновлений сервера: архив fpl-ops из хранилища с файлом apply.sh внутри

    set -e

    . /etc/fpl.env

    mkdir -p /var/lib/fpl/ops

    cd /var/lib/fpl

    code=$(curl -sS -L -o ops.tgz.new -w ''%{http_code}'' --etag-compare ops.etag --etag-save ops.etag.new "$OPS_URL") || exit 0

    [ "$code" = "200" ] || { rm -f ops.tgz.new ops.etag.new; exit 0; }

    mv ops.etag.new ops.etag

    if [ -f ops.tgz ] && cmp -s ops.tgz ops.tgz.new; then rm -f ops.tgz.new; exit 0; fi

    d=/var/lib/fpl/ops/rel-$(date +%s)

    mkdir -p "$d" && tar -xzf ops.tgz.new -C "$d"

    mv ops.tgz.new ops.tgz

    [ -f "$d/apply.sh" ] || { logger "fpl-ops: нет apply.sh"; exit 1; }

    ( cd "$d" && bash apply.sh ) >> /var/log/fpl-ops.log 2>&1 && logger "fpl-ops: применено $d" || logger "fpl-ops: ОШИБКА $d"

    '
- path: /usr/local/bin/fpl-cert
  permissions: '0755'
  content: "#!/bin/bash\n# выпустить HTTPS-сертификат, когда домен и www указывают на этот сервер\n. /etc/fpl.env\n[ -d /etc/letsencrypt/live/$DOMAIN ] && exit 0\nip=$(curl -s https://api.ipify.org)\n[ \"$(dig +short A $DOMAIN @1.1.1.1 | tail -1)\" = \"$ip\" ] || exit 0\n[ \"$(dig +short A www.$DOMAIN @1.1.1.1 | tail -1)\" = \"$ip\" ] || exit 0\ncertbot --nginx -n --agree-tos --register-unsafely-without-email --redirect \\\n  -d $DOMAIN -d www.$DOMAIN && logger \"fpl-cert: сертификат выпущен\"\n"
- path: /etc/nginx/sites-available/fpl
  content: "server {\n  listen 80 default_server;\n  listen [::]:80 default_server;\n  server_name facepaintingleague.com www.facepaintingleague.com _;\n  root /var/www/fpl/current;\n  index index.html;\n  charset utf-8;\n  client_max_body_size 6m;\n\n  # основной адрес — без www\n  if ($host = www.facepaintingleague.com) { return 301 $scheme://facepaintingleague.com$request_uri; }\n\n  location / { try_files $uri $uri/ $uri.html =404; }\n  location /assets/ { expires 7d; add_header Cache-Control \"public\"; }\n  location ~* \\.html$ { add_header Cache-Control \"no-cache\"; }\n  # данные из бота\n  location /data/ { alias /var/lib/fpl/data/; add_header Cache-Control \"no-cache\"; default_type application/json; }\n  location /media/ { alias /var/lib/fpl/media/; expires 30d; }\n  # приёмник данных из бота\n  location /api/ { proxy_pass http://127.0.0.1:8081; proxy_set_header Host $host; proxy_read_timeout 60s; }\n  error_page 404 /index.html;\n\n  gzip on; gzip_types text/css application/javascript\
    \ application/json image/svg+xml text/plain application/xml;\n  add_header X-Content-Type-Options nosniff;\n  server_tokens off;\n}\n"
runcmd:
- mkdir -p /var/lib/fpl/data /var/lib/fpl/parts /var/lib/fpl/media /var/lib/fpl/ops
- chown -R www-data:www-data /var/lib/fpl/data /var/lib/fpl/parts /var/lib/fpl/media
- rm -f /etc/nginx/sites-enabled/default
- ln -sf /etc/nginx/sites-available/fpl /etc/nginx/sites-enabled/fpl
- mkdir -p /var/www/fpl/placeholder && echo "<!doctype html><meta charset=utf-8><title>Face Painting League</title><p>Face Painting League</p>" > /var/www/fpl/placeholder/index.html
- ln -sfn /var/www/fpl/placeholder /var/www/fpl/current
- /usr/local/bin/fpl-sync || true
- systemctl daemon-reload && systemctl enable --now fpl-ingest
- systemctl enable --now nginx && systemctl reload nginx
- printf '*/5 * * * * root /usr/local/bin/fpl-sync\n2-59/5 * * * * root /usr/local/bin/fpl-ops\n*/10 * * * * root /usr/local/bin/fpl-cert\n' > /etc/cron.d/fpl
- /usr/local/bin/fpl-cert || true
