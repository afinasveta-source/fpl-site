- printf '*/5 * * * * root /usr/local/bin/fpl-sync\n2-59/5 * * * * root /usr/local/bin/fpl-ops\n*/10 * * * * root /usr/local/bin/fpl-cert\n7-59/10 * * * * root /usr/local/bin/fpl-photo-archive >> /var/log/fpl-photo-archive.log 2>&1\n' > /etc/cron.d/fpl
- /usr/local/bin/fpl-cert || true
